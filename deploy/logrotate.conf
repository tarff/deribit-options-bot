# Logrotate configuration for options trading bot and dashboard
# Install: sudo cp deploy/logrotate.conf /etc/logrotate.d/options-bot
#
# This rotates logs weekly, keeps 4 weeks of history, and compresses old logs.
# Path is updated by pi-setup.sh during installation.

/home/pi/options-trading-bot/logs/bot.log
/home/pi/options-trading-bot/logs/dashboard.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    create 0644 pi pi
    copytruncate
    size 50M
}
